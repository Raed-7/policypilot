name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: docker compose build
      - name: Start stack and check health
        run: |
          docker compose up -d
          for i in $(seq 1 40); do
            if curl -sf http://localhost:8000/health && curl -sf http://localhost:8501/_stcore/health; then exit 0; fi
            sleep 5
          done
          docker compose logs
          exit 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "policypilot"
version = "1.0.0"
description = "Grounded question answering over company policy documents, with page-level citations."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

[tool.setuptools.packages.find]
include = ["policypilot*", "evaluation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: tests that load the real embedding model",
]
addopts = "-q"
